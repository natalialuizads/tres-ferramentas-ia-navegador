<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produtos - Loja Terra</title>
<!-- Pré-carga da imagem principal e da fonte -->
<link rel="preload" as="image" href="img/hero-1440.webp" fetchpriority="high">
<link rel="preload" as="font" type="font/otf" href="/assets/fonts/Inter-Regular.otf" crossorigin>
<style>
@font-face {
  font-family: "Inter";
  src: url("/assets/fonts/Inter-Regular.otf") format("opentype");
  font-weight: 400;
  font-display: swap;
}
* { box-sizing: border-box; }
body { margin: 0; background: #f4eee2; color: #2b2723; font: 400 16px/1.5 "Inter", system-ui, sans-serif; }
a { color: #2f5d3a; }

.faixa { min-height: 48px; padding: 12px 48px; background: #2f5d3a; color: #fff; font-size: 15px; text-align: center; }

.topo { height: 72px; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e3d9c4; }
.marca { font-size: 18px; font-weight: 600; color: #2b2723; text-decoration: none; }
.topo nav { display: flex; gap: 24px; }
.topo nav a { font-size: 15px; font-weight: 600; text-decoration: none; }

.destaque { position: relative; }
.destaque img { display: block; width: 100%; height: auto; aspect-ratio: 8 / 3; }
.destaque-texto { position: absolute; left: 48px; bottom: 40px; max-width: 520px; padding: 24px 28px; background: rgba(251, 247, 238, 0.92); border-radius: 12px; }
.destaque-texto h1 { margin: 0 0 6px; font-size: 28px; line-height: 34px; }
.destaque-texto p { margin: 0; color: #6b6257; }

.conteudo { padding: 40px 48px 64px; }
.conteudo h2 { margin: 0 0 24px; font-size: 22px; }
.grade { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
.card { background: #fbf7ee; border: 1px solid #e3d9c4; border-radius: 12px; overflow: hidden; min-height: 320px; }
.card img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; background: #e8dcc4; }
.card-info { padding: 14px 16px 18px; }
.card-info h3 { margin: 0 0 2px; font-size: 16px; }
.card-info p { margin: 0; color: #6b6257; font-size: 14px; }
.card-info .preco { margin-top: 6px; font-weight: 600; color: #2b2723; }

/* Esqueleto: ocupa o espaço enquanto a API responde */
.esqueleto .bloco { aspect-ratio: 3 / 2; background: #e8dcc4; }
.esqueleto .linha { height: 14px; margin: 14px 16px 0; border-radius: 4px; background: #e8dcc4; }

.mais { display: block; margin: 32px auto 0; height: 44px; padding: 0 28px; border: 1px solid #cdbfa8; border-radius: 8px; background: #fffdf8; font: inherit; font-weight: 600; color: #2b2723; cursor: pointer; }

@media (max-width: 900px) {
  .topo { padding: 0 20px; height: 56px; }
  .faixa { padding: 12px 16px; }
  .destaque-texto { left: 16px; right: 16px; bottom: 16px; padding: 16px; }
  .conteudo { padding: 24px 16px 48px; }
  .grade { grid-template-columns: repeat(2, 1fr); gap: 16px; }
}
</style>
</head>
<body>
<!-- Espaço da faixa reservado desde o início: não causa deslocamento de layout -->
<div class="faixa">Frete grátis nas compras acima de R$ 200</div>

<header class="topo">
  <a class="marca" href="/">Loja Terra</a>
  <nav><a href="/cadastro/">Criar conta</a><a href="/login/">Entrar</a></nav>
</header>

<section class="destaque">
  <img src="img/hero-1440.webp" width="1440" height="540" fetchpriority="high" alt="Louças e utensílios de cerâmica sobre uma bancada">
  <div class="destaque-texto">
    <h1>Peças de cerâmica feitas à mão</h1>
    <p>Louças e utensílios para a mesa de todos os dias.</p>
  </div>
</section>

<main class="conteudo">
  <h2>Produtos</h2>
  <ul id="lista" class="grade">
    <li class="card esqueleto"><div class="bloco"></div><div class="linha"></div><div class="linha"></div></li>
    <li class="card esqueleto"><div class="bloco"></div><div class="linha"></div><div class="linha"></div></li>
    <li class="card esqueleto"><div class="bloco"></div><div class="linha"></div><div class="linha"></div></li>
    <li class="card esqueleto"><div class="bloco"></div><div class="linha"></div><div class="linha"></div></li>
  </ul>
  <button type="button" class="mais" id="mais" hidden>Ver mais produtos</button>
</main>

<script src="lenta.js" defer></script>
</body>
</html>
